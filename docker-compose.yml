services:
  postgres:
    image: postgres:16-alpine
    container_name: golab-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: golab
      POSTGRES_PASSWORD: golab_dev_password
      POSTGRES_DB: golab_tournament
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: golab-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
